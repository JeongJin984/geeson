dependencies {
    implementation project(":support:constant")
    implementation project(":support:enums")

    implementation project(":application:backoffice-app")

    implementation project(":domain:payment-domain")

    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5')
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("com.querydsl:querydsl-jpa:${property("queryDslVersion")}:jakarta")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation('com.fasterxml.jackson.core:jackson-databind:2.13.4.2')
    runtimeOnly("mysql:mysql-connector-java:${property("mysqlVersion")}")
    annotationProcessor("com.querydsl:querydsl-apt:${property("queryDslVersion")}:jakarta")
    annotationProcessor("jakarta.annotation:jakarta.annotation-api")
    annotationProcessor("jakarta.persistence:jakarta.persistence-api")

    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
}

def queryDslDir = "src/main/generated"
tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorGeneratedSourcesDirectory(file(queryDslDir))
}

sourceSets {
    main {
        java {
            srcDirs += queryDslDir
        }
    }
}

clean.doLast {
    file(queryDslDir).delete()
}

tasks.named("bootJar") {
    enabled = false
}